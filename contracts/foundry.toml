[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Sin confirmar qué hardforks soporta HSK Chain: "paris" evita opcodes nuevos (PUSH0/MCOPY...).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

# RPCs vía variables de entorno (nunca hardcodeadas)
[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC}"
hsk_mainnet = "${HSK_MAINNET_RPC}"
